name: tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest -k expression to narrow the test run"
        required: false
        default: ""

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Environment variable to support color support (jaraco/skeleton#66)
  FORCE_COLOR: 1

  # Suppress noisy pip warnings
  PIP_DISABLE_PIP_VERSION_CHECK: 'true'
  PIP_NO_WARN_SCRIPT_LOCATION: 'true'

  # PyPI time-machine date = day after the 79.0.1 release (2025-04-23)
  TM_DATE: "2025-04-24"

  # setuptools 79.0.1's SetuptoolsDeprecationWarnings carry due dates that have
  # passed since the release; with enforcement on (tox.ini default 1) they turn
  # into errors instead of warnings, failing dozens of tests that assert the
  # warning (`pytest.warns`).
  SETUPTOOLS_ENFORCE_DEPRECATION: "0"

  # Ensure tests can sense settings about the environment
  # The `check` (pytest-ruff/pytest-checkdocs) and `type` (pytest-mypy) extras
  # are dropped because they inject lint/type-check items into pytest (not tests).
  # Test-dependency installs are pinned to the release-date (2025-04-23) PyPI
  # time machine so the suite runs against the dependency set it was released with.
  # `wheel<0.46` because wheel 0.46.0/0.46.1 (served by the time machine) were
  # later yanked and make `wheel.metadata` private with a DeprecationWarning that
  # fails test_core_metadata under filterwarnings=error. The `test` job
  # redefines this with a per-leg index date.
  TOX_OVERRIDE: >-
    testenv.pass_env+=GITHUB_*,FORCE_COLOR;testenv.extras=test,cover,enabler,core;testenv.deps+=wheel<0.46;testenv.install_command=python -I -m pip install --index-url https://:2025-04-24@time-machines-pypi.sealsecurity.io/ {opts} {packages}


jobs:
  test:
    strategy:
      fail-fast: false
      # https://blog.jaraco.com/efficient-use-of-ci-resources/
      matrix:
        python:
        - "3.9"
        - "3.13"
        platform:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        include:
        - python: "3.10"
          platform: ubuntu-latest
        - python: "3.11"
          platform: ubuntu-latest
        - python: "3.12"
          platform: ubuntu-latest
        - python: "3.14"
          platform: ubuntu-latest
        - python: pypy3.10
          platform: ubuntu-latest
          distutils: stdlib
        - platform: ubuntu-latest
          python: "3.10"
          distutils: stdlib
    runs-on: ${{ matrix.platform }}
    # XXX: pypy seems to be flaky with unrelated tests in #6345
    env:
      SETUPTOOLS_USE_DISTUTILS: ${{ matrix.distutils || 'local' }}
      # Python 3.14 was a pre-release at 79.0.1's release; its deps (e.g. pymongo
      # via pytest-perf) have no cp314 wheels until autumn 2025, so that leg
      # resolves from a later index date.
      TM_DATE: ${{ matrix.python == '3.14' && '2025-10-15' || '2025-04-24' }}
      TOX_OVERRIDE: >-
        testenv.pass_env+=GITHUB_*,FORCE_COLOR;testenv.extras=test,cover,enabler,core;testenv.deps+=wheel<0.46;testenv.deps+=pytest-rerunfailures;testenv.install_command=python -I -m pip install --index-url https://:${{ matrix.python == '3.14' && '2025-10-15' || '2025-04-24' }}@time-machines-pypi.sealsecurity.io/ {opts} {packages}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # Install dependencies for building packages on pre-release Pythons
        # jaraco/skeleton#161
        if: matrix.python == '3.14' && matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libxml2-dev libxslt-dev
      - name: Setup Python
        id: python-install
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
        env:
          # Workaround for actions/setup-python#981 (env var only modified for this specific step)
          # The Windows 3.9 toolcache's pre-installed _distutils_hack crashes
          # setup-python's ensurepip with KeyError '__file__' under 'local', same
          # actions/setup-python#981 issue.
          SETUPTOOLS_USE_DISTUTILS: ${{ (matrix.platform == 'macos-latest' || matrix.platform == 'windows-latest') && matrix.python == '3.9' && 'stdlib' || matrix.distutils || 'local' }}
      - uses: actions/cache@v4
        id: cache
        with:
          path: setuptools/tests/config/downloads/*.cfg
          key: >-
            ${{ hashFiles('setuptools/tests/config/setupcfg_examples.txt') }}-
            ${{ hashFiles('setuptools/tests/config/downloads/*.py') }}
      - name: Populate download cache
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: setuptools/tests/config
        run: python -m downloads.preload setupcfg_examples.txt
      - name: Adjust env vars
        shell: bash
        run: |
          echo 'PIPX_DEFAULT_PYTHON=${{ steps.python-install.outputs.python-path }}' >> $GITHUB_ENV
      - name: Pre-build distributions for test
        shell: bash
        run: |
          rm -rf dist
          # workaround for pypa/setuptools#4333
          # `pipx run build` is replaced by an equivalent pip-installed build: today's
          # pipx needs pip>=26.1 (no Python 3.9) and runs on Homebrew Python 3.15 on
          # macOS. build itself comes from the release-era index.
          python -m pip install --index-url "https://:${{ env.TM_DATE }}@time-machines-pypi.sealsecurity.io/" build 'pyproject-hooks!=1.1'
          python -m build
          echo "PRE_BUILT_SETUPTOOLS_SDIST=$(ls dist/*.tar.gz)" >> $GITHUB_ENV
          echo "PRE_BUILT_SETUPTOOLS_WHEEL=$(ls dist/*.whl)" >> $GITHUB_ENV
          rm -rf setuptools.egg-info  # Avoid interfering with the other tests
      - name: Workaround for unreleased PyNaCl (pyca/pynacl#805)
        if: contains(matrix.python, 'pypy')
        run: echo "SETUPTOOLS_ENFORCE_DEPRECATION=0" >> $GITHUB_ENV
      - name: Install tox
        # release-era tox/virtualenv so the tox venv is seeded with a release-era
        # pip (pip>=25.3 dropped the legacy setup.py build path that
        # test_easy_install/test_dist/test_namespaces exercise)
        run: python -m pip install --index-url "https://:${{ env.TM_DATE }}@time-machines-pypi.sealsecurity.io/" tox
      - name: Run
        shell: bash
        # exercises.py holds pytest-perf startup benchmarks (not tests); pytest-perf
        # derives the project name from the checkout dir, which on the fork is not
        # `setuptools`, so it cannot resolve the baseline.
        # PyPy flakes on a different unrelated test each run (upstream #6345, why
        # upstream made this leg continue-on-error); a failed test is retried there.
        run: tox -- --ignore=exercises.py ${{ contains(matrix.python, 'pypy') && '--reruns 2' || '' }} ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}

  collateral:
    if: false
    strategy:
      fail-fast: false
      matrix:
        job:
        - diffcov
        - docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install tox
        run: python -m pip install tox
      - name: Eval ${{ matrix.job }}
        run: tox -e ${{ matrix.job }}

  check:  # This job does nothing and is only used for the branch protection
    if: false
    timeout-minutes: 10

    needs:
    - integration-test
    - test
    - collateral
    - test_cygwin

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        allowed-skips: integration-test
        jobs: ${{ toJSON(needs) }}

  test_cygwin:
    strategy:
      fail-fast: false
      matrix:
        python:
        - 39
        platform:
        - windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    env:
      # The `check` extra is dropped (lint items) and jaraco.develop is excluded on
      # cygwin, so nothing else installs jaraco.packaging, which tools/vendored.py
      # imports at collection time.
      TOX_OVERRIDE: >-
        testenv.pass_env+=GITHUB_*,FORCE_COLOR;testenv.extras=test,cover,enabler,core;testenv.deps+=wheel<0.46;testenv.deps+=jaraco.packaging;testenv.install_command=python -I -m pip install --index-url https://:2025-04-24@time-machines-pypi.sealsecurity.io/ {opts} {packages}
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin with Python
        uses: cygwin/cygwin-install-action@v4
        with:
          platform: x86_64
          packages: >-
            python${{ matrix.python }},
            python${{ matrix.python }}-devel,
            python${{ matrix.python }}-pip,
            gcc-core,
            git,
      - name: Record the currently selected Python version
        id: python-install
        # NOTE: This roughly emulates what `actions/setup-python` provides
        # NOTE: except the action gets the version from the installation path
        # NOTE: on disk and we get it from runtime.
        run: |
          python -c 'import platform; print("python-version=" + platform.python_version())' >> ${GITHUB_OUTPUT}
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
      - name: Install tox using pip
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
        run: |
          # Workaround for https://github.com/pypa/setuptools/issues/4831
          python -m pip install --index-url "https://:${TM_DATE}@time-machines-pypi.sealsecurity.io/" tox
      - name: Run tests
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
        run: |
          git config --global --add safe.directory "$(cygpath -u "${{ github.workspace }}")" # workaround for #3408
          echo "$(cygpath -u "${{ github.workspace }}")" # for debugging purposes
          python -m tox -- --ignore=exercises.py ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}

  integration-test:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
    # To avoid long times and high resource usage, we assume that:
    # 1. The setuptools APIs used by packages don't vary too much with OS or
    #    Python implementation
    # 2. Any circumstance for which the previous assumption is not valid is
    #    already tested via unit tests (or other tests not classified here as
    #    "integration")
    # With that in mind, the integration tests can run for a single setup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install OS-level dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential gfortran libopenblas-dev libyaml-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Use a release that is not very new but still have a long life:
          python-version: "3.10"
      - name: Install tox
        run: |
          python -m pip install --index-url "https://:${{ env.TM_DATE }}@time-machines-pypi.sealsecurity.io/" tox
      - name: Run integration tests
        run: tox -e integration

  build:
    # Replicates `tox -e release` (tox.ini) without the twine upload / GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        # `saveopts` is a command registered by an installed setuptools' entry
        # points (tox's release venv had one); the checked-in bootstrap.egg-info
        # only registers egg_info/build_py/sdist/editable_wheel. setup.py still
        # imports the source-tree setuptools.
        run: python -m pip install --index-url 'https://:2025-04-24@time-machines-pypi.sealsecurity.io/' build 'pyproject-hooks!=1.1' setuptools==79.0.0
      - name: Build distributions
        run: |
          python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          # unset tag_build and tag_date pypa/setuptools#2500
          python setup.py egg_info -Db "" saveopts
          python -m build
          ls -l dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs:
    - check
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install tox
        run: python -m pip install tox
      - name: Run
        run: tox -e release
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
